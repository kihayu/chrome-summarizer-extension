<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Summarizer</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">
    <h1>Article Summarizer</h1>
    <div id="summary-container">
      <div id="loading-container" class="hidden">
        <div class="loader"></div>
        <p>Generating summary...</p>
      </div>

      <div id="default-message" class="message-box">
        <p>Navigate to an article page and the extension will generate a summary for you.</p>
      </div>

      <div id="summary-content" class="hidden">
        <h2>Summary</h2>
        <p id="summary-text" class="summary-box"></p>
      </div>
    </div>

    <button id="refreshButton">Refresh Summary</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
